server:
  port: 8086
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER}
          jwk-set-uri: ${KEYCLOAK_INTERNAL:http://keycloak:8080}/realms/medlearn/protocol/openid-connect/certs
medlearn:
  exam-url: ${EXAM_SERVICE:http://exam-service:8085}
  verification-base: ${VERIFICATION_BASE:http://localhost:3000/verify}
  user-url: ${USER_SERVICE:http://user-service:8082}
  course-url: ${COURSE_SERVICE:http://course-service:8084}

  oauth:
    token-url: ${KEYCLOAK_INTERNAL:http://keycloak:8080}/realms/medlearn/protocol/openid-connect/token
    client-id: ${SERVICE_CLIENT_ID:medlearn-certificate-service}
    client-secret: ${SERVICE_CLIENT_SECRET:}
