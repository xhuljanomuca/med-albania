server:
  port: 8085
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER}
          jwk-set-uri: ${KEYCLOAK_INTERNAL:http://keycloak:8080}/realms/medlearn/protocol/openid-connect/certs
services:
  courses: ${COURSE_SERVICE:http://course-service:8084}

medlearn:
  security:
    audience: ${JWT_AUDIENCE:medlearn-api}
  oauth:
    token-url: ${KEYCLOAK_INTERNAL:http://keycloak:8080}/realms/medlearn/protocol/openid-connect/token
    client-id: ${SERVICE_CLIENT_ID:medlearn-exam-service}
    client-secret: ${SERVICE_CLIENT_SECRET:}

# JWT_AUDIENCE must match Keycloak audience mapper for this service.
