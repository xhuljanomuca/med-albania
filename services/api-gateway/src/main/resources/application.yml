server:
  port: 8080
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER}
          jwk-set-uri: http://keycloak:8080/realms/medlearn/protocol/openid-connect/certs

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: users
              uri: ${USER_SERVICE:http://user-service:8082}
              predicates: [Path=/api/users/**]
            - id: enrollments
              uri: ${ENROLLMENT_SERVICE:http://enrollment-service:8083}
              predicates: [Path=/api/enrollments/**]
            - id: courses
              uri: ${COURSE_SERVICE:http://course-service:8084}
              predicates: [Path=/api/courses,/api/courses/**]
            - id: exams
              uri: ${EXAM_SERVICE:http://exam-service:8085}
              predicates: [Path=/api/exams/**]
            - id: certificates
              uri: ${CERTIFICATE_SERVICE:http://certificate-service:8086}
              predicates: [Path=/api/certificates/**]
          default-filters:
            - RemoveRequestHeader=X-Internal-Secret
            - RemoveRequestHeader=X-Forwarded-Client-Cert

medlearn:
  security:
    audience: ${JWT_AUDIENCE:medlearn-api}
